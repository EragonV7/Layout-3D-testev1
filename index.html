**O que foi indevidamente removido do `index_2.html`:**
* **Modo Cinemático e 1ª Pessoa (WASD):** Os botões `btn-cinema` e `btn-wasd` estão na interface, mas seus event listeners e cálculos matemáticos de câmera desapareceram[cite: 1].
* **Lógica da Empilhadeira:** O código atual tenta chamar `criarEmpilhadeiraGrupo()`, `calcularInfoCorredores()` e `atualizarEmpilhadeiraSelecao()` durante o carregamento[cite: 1], mas essas funções nunca foram declaradas, o que pode travar a renderização.
* **Loop de Física:** A função `animate()` base está lá[cite: 1], mas sem as atualizações de rotação contínua (cinemático) ou tradução de eixos (movimentação pelo teclado).

Para corrigir isso de forma definitiva, apague a função `animate()` original que está nas últimas linhas do seu arquivo e cole o bloco completo abaixo logo antes do `</script>`. Ele restaura todas as interações perdidas.

// --- 8. RESTAURAÇÃO: MODO CINEMÁTICO E 1ª PESSOA ---
let cinematicoAtivo = false;
let anguloCinema = 0;

document.getElementById('btn-cinema').addEventListener('click', function(e) {
    cinematicoAtivo = !cinematicoAtivo;
    this.classList.toggle('btn-toggle-ativo');
    if(cinematicoAtivo) {
        modoWASD = false;
        document.getElementById('btn-wasd').classList.remove('btn-toggle-ativo');
    }
});

document.getElementById('btn-wasd').addEventListener('click', function(e) {
    modoWASD = !modoWASD;
    this.classList.toggle('btn-toggle-ativo');
    const legenda = document.getElementById('legenda-controles');
    const hudLeg = document.getElementById('hud-legenda');
    
    if(modoWASD) {
        cinematicoAtivo = false;
        document.getElementById('btn-cinema').classList.remove('btn-toggle-ativo');
        legenda.style.display = 'block';
        hudLeg.style.display = 'block';
    } else {
        legenda.style.display = 'none';
        if(!modoStatusAtivo) hudLeg.style.display = 'none';
    }
});

window.addEventListener('keydown', (e) => { 
    if(teclas.hasOwnProperty(e.key.toLowerCase())) teclas[e.key.toLowerCase()] = true; 
});
window.addEventListener('keyup', (e) => { 
    if(teclas.hasOwnProperty(e.key.toLowerCase())) teclas[e.key.toLowerCase()] = false;

// --- 9. RESTAURAÇÃO: EMPILHADEIRA E MÓDULOS AUSENTES ---

// --- 10. LOOP DE RENDERIZAÇÃO COMPLETO ---
function animate() {
    requestAnimationFrame(animate);
    
    if (cinematicoAtivo && modeloGeral) {
        anguloCinema += 0.002;
        camera.position.x = centroGeral.x + (tamanhoMax * 1.8) * Math.cos(anguloCinema);
        camera.position.z = centroGeral.z + (tamanhoMax * 1.8) * Math.sin(anguloCinema);
        camera.lookAt(centroGeral);
    }
    
    if (modoWASD) {
        const speed = 1.5;
        if(teclas.w) camera.translateZ(-speed);
        if(teclas.s) camera.translateZ(speed);
        if(teclas.a) camera.translateX(-speed);
        if(teclas.d) camera.translateX(speed);
    } else if (!cinematicoAtivo) {
        controls.update(); 
    }
    
    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
