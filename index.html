<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout 3D Holográfico - Power BI</title>
    <style>
        /* Paleta Cyberpunk / Holográfica */
        body { margin: 0; overflow: hidden; background: #040914; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top:0; left:0; z-index: 1; }
        
        /* Painel de Controles */
        #ui-controles { position: absolute; top: 15px; left: 15px; z-index: 10; display: flex; gap: 8px; flex-wrap: wrap; max-width: 420px; }
        .btn { background: #0f1724; color: #00f3ff; border: 1px solid #005b7a; padding: 10px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 13px; transition: all 0.3s; box-shadow: 0 2px 8px rgba(0,243,255,0.1); }
        .btn:hover { background: #00f3ff; color: #040914; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,243,255,0.4); }
        .btn:active { transform: translateY(0); }
        .btn-toggle-ativo { background: #00ff55 !important; color: #040914 !important; border-color: #00ff55 !important; } 
        .btn-status { background: #6200ea; border-color: #9d46ff; color: #fff; } 
        .btn-status:hover { background: #9d46ff; color: #fff; }

        /* HUD Global */
        #hud-topo { position: absolute !important; top: 15px !important; right: 15px !important; left: auto !important; transform: none !important; background: rgba(4, 9, 20, 0.85); display: flex; gap: 25px; padding: 12px 25px; border-radius: 8px; box-shadow: 0 0 15px rgba(0,243,255,0.2); z-index: 20; border: 1px solid #005b7a; border-bottom: 4px solid #00f3ff; backdrop-filter: blur(4px); }
        .hud-box { text-align: center; color: #fff; min-width: 80px; }
        .hud-box .titulo { font-size: 11px; color: #80d8ff; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; display: block; font-weight: bold; }
        .hud-box .valor { font-size: 20px; font-weight: bold; text-shadow: 0 0 8px rgba(255,255,255,0.4); }

        /* Placas de Corredor (CSS2D) */
        .placa-corredor { background: rgba(4, 9, 20, 0.9); color: #00f3ff; padding: 6px 16px; border-radius: 4px; font-weight: bold; font-size: 16px; border: 1px solid #00f3ff; pointer-events: none; text-align: center; box-shadow: 0 0 15px rgba(0,243,255,0.4); text-transform: uppercase; letter-spacing: 2px; }

        /* Tooltip Flutuante */
        #tooltip { position: fixed !important; background: rgba(4, 9, 20, 0.95); color: #e0f7fa; padding: 12px 16px; border-radius: 6px; display: none; pointer-events: none; z-index: 100000 !important; font-size: 13px; box-shadow: 0 0 20px rgba(0,243,255,0.3); border: 1px solid #005b7a; border-top: 4px solid #00f3ff; min-width: 170px; backdrop-filter: blur(4px); }
        .tt-header { font-weight: bold; font-size: 15px; margin-bottom: 10px; border-bottom: 1px solid #005b7a; padding-bottom: 6px; color: #00f3ff; text-shadow: 0 0 5px rgba(0,243,255,0.5); }
        .tt-line { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .tt-label { color: #80d8ff; }
        .tt-value { font-weight: bold; color: #fff; text-align: right; margin-left: 20px; }

        /* Painel Lateral KPI */
        #painel-kpi { position: absolute !important; top: 95px !important; right: 15px !important; left: auto !important; transform: none !important; width: 280px; z-index: 30; background: rgba(4, 9, 20, 0.95); border-radius: 8px; box-shadow: 0 0 25px rgba(0,0,0,0.8); display: none; overflow: hidden; border: 1px solid #005b7a; border-top: 4px solid #00f3ff; backdrop-filter: blur(4px); color: #e0f7fa; }
        #painel-kpi .cabecalho { background: rgba(0, 91, 122, 0.4); padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 16px; border-bottom: 1px solid #005b7a; color: #00f3ff; }
        #painel-kpi .fechar { cursor: pointer; font-size: 20px; color: #80d8ff; line-height: 1; transition: color 0.2s; }
        #painel-kpi .fechar:hover { color: #ff0055; text-shadow: 0 0 8px rgba(255,0,85,0.6); }
        #painel-kpi .corpo { padding: 15px; }
        #painel-kpi .linha { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
        #painel-kpi .rotulo { color: #80d8ff; }
        #painel-kpi .valor { font-weight: bold; color: #fff; text-align: right; }
        .barra-fundo { background: #0f1724; border-radius: 4px; height: 8px; overflow: hidden; border: 1px solid #005b7a; }
        .barra-preenchida { height: 100%; border-radius: 3px; transition: width 0.5s ease, background 0.5s ease; box-shadow: 0 0 8px currentColor; }

        /* Legenda flutuante */
        #hud-legenda { position: absolute !important; bottom: 15px !important; right: 15px !important; left: auto !important; z-index: 20; background: rgba(4, 9, 20, 0.85); color: #e0f7fa; border-radius: 8px; box-shadow: 0 0 15px rgba(0,0,0,0.5); padding: 12px 16px; font-size: 12px; max-width: 230px; display: none; border: 1px solid #005b7a; border-top: 4px solid #00f3ff; backdrop-filter: blur(4px); }
        #hud-legenda h4 { margin: 0 0 8px 0; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #00f3ff; }
        #hud-legenda .legenda-cor-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        #hud-legenda .swatch { width: 13px; height: 13px; border-radius: 3px; flex-shrink: 0; box-shadow: 0 0 5px currentColor; }
        #hud-legenda .legenda-secao + .legenda-secao { margin-top: 12px; padding-top: 10px; border-top: 1px solid #005b7a; }
        #hud-legenda .tecla { display: inline-block; background: #0f1724; border: 1px solid #00f3ff; border-radius: 4px; padding: 1px 7px; font-family: 'Consolas', monospace; font-weight: bold; margin-right: 3px; font-size: 11px; color: #00f3ff; }

        /* Tela de carregamento */
        #tela-carregamento { position: fixed; inset: 0; background: #040914; z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; transition: opacity 0.7s ease; }
        #tela-carregamento.escondida { opacity: 0; pointer-events: none; }
        #tela-carregamento .spinner { width: 52px; height: 52px; border: 4px solid #0f1724; border-top-color: #00f3ff; border-radius: 50%; animation: girar-spinner 0.9s linear infinite; margin-bottom: 20px; box-shadow: 0 0 15px rgba(0,243,255,0.2); }
        #tela-carregamento .texto-carregamento { font-size: 13px; letter-spacing: 2px; color: #80d8ff; text-transform: uppercase; }
        #tela-carregamento .pct-carregamento { font-size: 30px; font-weight: bold; margin-top: 8px; color: #fff; text-shadow: 0 0 10px rgba(0,243,255,0.5); }
        @keyframes girar-spinner { to { transform: rotate(360deg); } }

        .btn-cinema { background: #0f1724; border: 1px solid #005b7a; }
        .btn-cinema.btn-toggle-ativo { background: #00f3ff !important; color: #040914 !important; border-color: #00f3ff; box-shadow: 0 0 15px rgba(0,243,255,0.6); }
    </style>

    <!-- Bibliotecas Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
</head>
<body>
    
    <div id="tela-carregamento">
        <div class="spinner"></div>
        <div class="texto-carregamento">Sincronizando Malha 3D</div>
        <div class="pct-carregamento" id="pct-carregamento">0%</div>
    </div>

    <div id="ui-controles">
        <button class="btn" id="btn-frente">Frente</button>
        <button class="btn" id="btn-topo">Topo</button>
        <button class="btn" id="btn-lado">Lado</button>
        <button class="btn btn-status" id="btn-status">Modo: Status (Desligado)</button>
        <button class="btn" id="btn-estrutura">Estruturas: Ocultas</button>
        <button class="btn" id="btn-wasd">Visão: 1ª Pessoa</button>
        <button class="btn btn-cinema" id="btn-cinema">Modo Cinemático</button>
    </div>

    <div id="hud-topo">
        <div class="hud-box">
            <span class="titulo">Capacidade</span>
            <span class="valor" id="hud-cap">0</span>
        </div>
        <div class="hud-box">
            <span class="titulo">Estoque</span>
            <span class="valor" id="hud-est">0</span>
        </div>
        <div class="hud-box">
            <span class="titulo">Ocupação</span>
            <span class="valor" id="hud-pct">0%</span>
        </div>
        <div class="hud-box" style="border-left: 1px solid #005b7a; padding-left: 20px;">
            <span class="titulo">Lidos do PBI</span>
            <span class="valor" id="hud-debug" style="color: #00ff55; text-shadow: 0 0 8px rgba(0,255,85,0.4);">0</span>
        </div>
        <div class="hud-box" style="border-left: 1px solid #005b7a; padding-left: 20px;">
            <span class="titulo">Empilhadeira</span>
            <span class="valor" id="hud-emp" style="color: #00f3ff;">Inativa</span>
        </div>
    </div>

    <div id="tooltip"></div>

    <div id="painel-kpi">
        <div class="cabecalho">
            <span id="kpi-endereco">Endereço</span>
            <span class="fechar" id="kpi-fechar">&times;</span>
        </div>
        <div class="corpo">
            <div class="linha"><span class="rotulo">Produto</span><span class="valor" id="kpi-produto">-</span></div>
            <div class="linha"><span class="rotulo">Estoque</span><span class="valor" id="kpi-estoque">-</span></div>
            <div class="linha"><span class="rotulo">Capacidade</span><span class="valor" id="kpi-capacidade">-</span></div>
            <div class="linha"><span class="rotulo">Status</span><span class="valor" id="kpi-status">-</span></div>
            <div style="margin-top: 15px;">
                <div class="linha" style="margin-bottom: 2px;"><span class="rotulo">Ocupação</span><span class="valor" id="kpi-pct">0%</span></div>
                <div class="barra-fundo" style="margin-top: 5px;"><div class="barra-preenchida" id="kpi-barra"></div></div>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <div id="hud-legenda">
        <div class="legenda-secao" id="legenda-status" style="display:none;">
            <h4>Legenda de Status</h4>
            <div class="legenda-cor-item"><span class="swatch" style="background:#00ff55; color:#00ff55;"></span> Normal / OK</div>
            <div class="legenda-cor-item"><span class="swatch" style="background:#ffb700; color:#ffb700;"></span> Estoque Baixo</div>
            <div class="legenda-cor-item"><span class="swatch" style="background:#ff0055; color:#ff0055;"></span> Crítico</div>
        </div>
        <div class="legenda-secao" id="legenda-controles" style="display:none;">
            <h4>Controles (1ª Pessoa)</h4>
            <div style="margin-bottom:6px;"><span class="tecla">W</span><span class="tecla">A</span><span class="tecla">S</span><span class="tecla">D</span> mover</div>
            <div>Mouse (arrastar) — olhar ao redor</div>
        </div>
    </div>

    <script>
        // --- 1. ESTADO E COMUNICAÇÃO COM O POWER BI ---
        let dadosMap = {};
        let arrSelecionados = [];
        let modoStatusAtivo = false;
        let estruturasVisiveis = false;
        const dadosPorNomeBlender = {};
        const dadosPorEndereco = {};

        function atualizarHUD(qtdLidos = 0) {
            let capTotal = 0, estTotal = 0;
            let objCount = 0;
            for (const key in dadosMap) {
                capTotal += Number(dadosMap[key].capacidade) || 0;
                estTotal += Number(dadosMap[key].estoque) || 0;
                objCount++;
            }
            document.getElementById('hud-cap').innerText = capTotal;
            document.getElementById('hud-est').innerText = estTotal;
            const pct = capTotal > 0 ? Math.round((estTotal / capTotal) * 100) : 0;
            document.getElementById('hud-pct').innerText = pct + '%';
            document.getElementById('hud-debug').innerText = objCount; 
        }

        window.addEventListener('message', function(event) {
            if (event.data && event.data.tipo === 'dadosPowerBI') {
                let payload = event.data.dadosEstoque;
                if (typeof payload === 'string') {
                    try { payload = JSON.parse(payload); } catch(e) { console.warn("Erro ao ler JSON", e); }
                }

                dadosMap = {};
                let countLidos = 0;
                
                if (Array.isArray(payload)) {
                    payload.forEach(item => { 
                        const d = {};
                        for (let k in item) { d[k.toLowerCase()] = item[k]; }

                        const nomeBlenderRaw = d['nome_blender'] || d['nome blender'] || d['nome-do-blender'] || '';
                        const enderecoRaw = d['endereco'] || d['endereço'] || '';
                        
                        if(nomeBlenderRaw || enderecoRaw) {
                            const nomeBlenderKey = nomeBlenderRaw.toString().trim().toUpperCase();
                            const endKey = enderecoRaw.toString().trim().toUpperCase();
                            
                            const extrairNum = (v) => {
                                if(v == null) return 0;
                                if(typeof v === 'number') return v;
                                const str = v.toString().replace(',', '.').replace(/[^\d.-]/g, '');
                                return parseFloat(str) || 0;
                            };

                            const registro = {
                                nomeBlender: nomeBlenderRaw.toString().trim(),
                                endereco: enderecoRaw.toString().trim(),
                                codigoProduto: d['codigo produto'] || d['codigo_produto'] || 'N/A',
                                produto: d['descricao'] || d['produto'] || 'N/A',
                                unidadeMedida: d['unidade medida'] || d['unidade_medida'] || 'N/A',
                                estoque: extrairNum(d['saldo atual'] ?? d['estoque']),
                                custoUnitario: extrairNum(d['custo unitario'] ?? d['custo_unitario']),
                                custoTotal: extrairNum(d['custo total'] ?? d['custo_total']),
                                segmento: d['segmento'] || 'N/A',
                                validade: d['validade'] || 'N/A',
                                familia: d['familia'] || 'N/A',
                                giro: d['giro'] || 'N/A',
                                capacidade: extrairNum(d['capacidade']),
                                status: (d['status'] || 'OK').toString().trim()
                            };

                            if(nomeBlenderKey) dadosPorNomeBlender[nomeBlenderKey] = registro;
                            if(endKey) {
                                dadosPorEndereco[endKey] = registro;
                                dadosMap[endKey] = registro;
                            } else if(nomeBlenderKey) {
                                dadosMap[nomeBlenderKey] = registro;
                            }

                            countLidos++;
                        }
                    });
                }
                
                let sel = event.data.selecionados;
                if (sel && typeof sel === 'string' && sel.trim() !== "") {
                    arrSelecionados = sel.split(',').map(s => s.trim().toUpperCase());
                } else {
                    arrSelecionados = [];
                }
                
                atualizarHUD(countLidos);
                aplicarFiltrosECores();
                if(typeof atualizarEmpilhadeiraSelecao === 'function') atualizarEmpilhadeiraSelecao();
            }
        });

        // --- 2. CONFIGURAÇÃO DA CENA THREE.JS ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x040914); // Azul Abissal Sci-Fi
        scene.fog = new THREE.FogExp2(0x040914, 0.002); // Névoa holográfica

        // Grade holográfica no chão
        const gridHelper = new THREE.GridHelper(500, 150, 0x00f3ff, 0x005b7a);
        gridHelper.position.y = -0.1;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.4;
        scene.add(gridHelper);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        
        const labelRenderer = new THREE.CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none'; 
        document.body.appendChild(labelRenderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        
        // Iluminação ajustada para tons mais frios/tecnológicos
        scene.add(new THREE.AmbientLight(0x406080, 1.5));
        const dirLight = new THREE.DirectionalLight(0x00f3ff, 1.2);
        dirLight.position.set(50, 150, 50);
        scene.add(dirLight);

        // --- 2C. TWEEN SUAVE DE CÂMERA ---
        let tweenCameraAtivo = null;
        function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
        function tweenCamera(destPos, destTarget, duracaoMs, callback) {
            if (tweenCameraAtivo) tweenCameraAtivo.cancelado = true;
            const origemPos = camera.position.clone();
            const origemTarget = controls.target.clone();
            const inicio = performance.now();
            const estado = { cancelado: false };
            tweenCameraAtivo = estado;

            function passo(agora) {
                if (estado.cancelado) return;
                const t = Math.min((agora - inicio) / duracaoMs, 1);
                const te = easeInOutCubic(t);
                camera.position.lerpVectors(origemPos, destPos, te);
                controls.target.lerpVectors(origemTarget, destTarget, te);
                controls.update();
                if (t < 1) {
                    requestAnimationFrame(passo);
                } else {
                    if (tweenCameraAtivo === estado) tweenCameraAtivo = null;
                    if (callback) callback();
                }
            }
            requestAnimationFrame(passo);
        }

        let modeloGeral = null;
        let boxGeral = null;
        let centroGeral = new THREE.Vector3();
        let tamanhoMax = 0;
        let placasGeral = [];

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const tooltip = document.getElementById('tooltip');
        const painelKPI = document.getElementById('painel-kpi');

        let modoWASD = false;
        const teclas = { w: false, a: false, s: false, d: false };

        // --- 3. CARREGANDO O MODELO GLTF ---
        const gltfUrl = 'https://raw.githubusercontent.com/EragonV7/Layout-3D-testev1/141e6626bf72aa246d5d86a29bbe763ed7a1e954/Testev1.glb';
        const loader = new THREE.GLTFLoader();
        
        loader.load(gltfUrl, function (gltf) {
            modeloGeral = gltf.scene; 
            scene.add(modeloGeral);
            
            boxGeral = new THREE.Box3().setFromObject(modeloGeral);
            centroGeral = boxGeral.getCenter(new THREE.Vector3());
            const size = boxGeral.getSize(new THREE.Vector3());
            tamanhoMax = Math.max(size.x, size.y, size.z);
            
            controls.target.copy(centroGeral);
            const posFinalCamera = new THREE.Vector3(
                centroGeral.x + (tamanhoMax * 0.8),
                centroGeral.y + (tamanhoMax * 0.8),
                centroGeral.z + (tamanhoMax * 0.8)
            );
            camera.position.set(
                centroGeral.x + (tamanhoMax * 2.2),
                centroGeral.y + (tamanhoMax * 2.6),
                centroGeral.z + (tamanhoMax * 2.2)
            );
            controls.update();

            modeloGeral.traverse(child => {
                if (child.isMesh) {
                    child.material = child.material.clone();
                    
                    // Estilo metálico holográfico
                    if ('metalness' in child.material) child.material.metalness = 0.6;
                    if ('roughness' in child.material) child.material.roughness = 0.3;
                    
                    child.userData.corOriginal = child.material.color ? child.material.color.getHex() : 0xffffff;
                    aplicarCorEstrutura(child);
                }
            });

            criar3PlacasCorredor();
            atualizarVisibilidadePlacas();
            if(typeof calcularInfoCorredores === 'function') calcularInfoCorredores();
            if(typeof criarEmpilhadeiraGrupo === 'function') criarEmpilhadeiraGrupo();
            aplicarFiltrosECores();

            const telaCarregamento = document.getElementById('tela-carregamento');
            if (telaCarregamento) telaCarregamento.classList.add('escondida');
            tweenCamera(posFinalCamera, centroGeral.clone(), 2200);
        }, function (xhr) {
            const pctEl = document.getElementById('pct-carregamento');
            if (pctEl && xhr.total) {
                pctEl.innerText = Math.min(100, Math.round((xhr.loaded / xhr.total) * 100)) + '%';
            }
        }, function (erro) {
            console.error('[VISUAL] Falha ao carregar o modelo 3D:', erro);
            const textoEl = document.querySelector('#tela-carregamento .texto-carregamento');
            if (textoEl) textoEl.innerText = 'Erro ao carregar o modelo 3D';
        });

        // --- 4. FUNÇÕES DE SUPORTE E LEITURA DE NOMES ---
        function corPorStatus(status) {
            const s = (status || '').toUpperCase();
            if (s === 'CRITICO' || s === 'CRÍTICO') return 0xff0055; // Rosa Neon
            if (s === 'BAIXO') return 0xffb700; // Laranja/Amarelo Neon
            return 0x00ff55; // Verde Neon 
        }

        function normalizarNome(v) {
            return (v == null ? '' : v.toString()).trim().toUpperCase();
        }

        function getNomeBlenderDaHierarquia(obj) {
            let atual = obj;
            while (atual) {
                if (atual.name) {
                    const nome = normalizarNome(atual.name);
                    if (dadosPorNomeBlender[nome]) return nome;
                }
                atual = atual.parent;
            }
            return null;
        }

        function getEnderecoDaHierarquia(obj) {
            const nomeBlender = getNomeBlenderDaHierarquia(obj);
            if (nomeBlender && dadosPorNomeBlender[nomeBlender]) {
                return normalizarNome(dadosPorNomeBlender[nomeBlender].endereco || nomeBlender);
            }
            let atual = obj;
            while (atual) {
                if (atual.name) {
                    const upper = normalizarNome(atual.name);
                    const matchAtual = upper.match(/([A-Z]\d{2}(?:-N\d{2})?)/);
                    if (matchAtual) return matchAtual[1];
                }
                atual = atual.parent;
            }
            return null;
        }

        function getChaveBlenderDaHierarquia(obj) {
            const nome = getNomeBlenderDaHierarquia(obj);
            if (nome) return nome;
            let atual = obj;
            while (atual) {
                if (atual.name) {
                    const upper = normalizarNome(atual.name);
                    if (/^[A-Z]\d{2}(?:-N\d{2})?$/.test(upper)) return upper;
                }
                atual = atual.parent;
            }
            return null;
        }

        function buscarDadosSeguro(nome3D) {
            if (!nome3D) return null;
            const chave = normalizarNome(nome3D);
            if (dadosPorNomeBlender[chave]) return dadosPorNomeBlender[chave];
            if (dadosPorEndereco[chave]) return dadosPorEndereco[chave];
            if (dadosMap[chave]) return dadosMap[chave];

            const regex = /([A-Z]\d{2}(?:-N\d{2})?)/;
            const match3D = chave.match(regex);
            if (match3D) {
                const k = match3D[1];
                if (dadosPorNomeBlender[k]) return dadosPorNomeBlender[k];
                if (dadosPorEndereco[k]) return dadosPorEndereco[k];
                if (dadosMap[k]) return dadosMap[k];
            }

            for (const key in dadosPorNomeBlender) {
                if (key.includes(chave) || chave.includes(key)) return dadosPorNomeBlender[key];
            }
            for (const key in dadosPorEndereco) {
                if (key.includes(chave) || chave.includes(key)) return dadosPorEndereco[key];
            }
            return null;
        }

        function setMaterialColor(material, hex, emissiveHex = 0x000000, emissiveIntensity = 0) {
            if (!material) return;
            if (material.color && material.color.setHex) material.color.setHex(hex);
            if (material.emissive && material.emissive.setHex) {
                material.emissive.setHex(emissiveHex);
                material.emissiveIntensity = emissiveIntensity;
            }
        }

        function aplicarCorEstrutura(child) {
            if (!child || !child.isMesh) return;

            const data = buscarDadosSeguro(getChaveBlenderDaHierarquia(child));
            if (data) return; // elementos associados ao estoque preservam sua cor original

            const nome = normalizarNome(child.name || '');
            let cor = 0x1d6f8a;

            if (/(PILAR|MONTANTE|COLUNA|POSTE|VERTICAL)/.test(nome)) {
                cor = 0x14b866;
            } else if (/(PRATELEIRA|TRAVESSA|LONGARINA|BASE|BANDEJA|HORIZONTAL)/.test(nome)) {
                cor = 0x1e8bb8;
            } else if (/(ESTRUTURA|RACK|PORTA|FRAME|CHASSI|SUPORTE)/.test(nome)) {
                cor = 0x237c98;
            } else {
                // Heurística geométrica para modelos sem nomes semânticos
                try {
                    const box = new THREE.Box3().setFromObject(child);
                    const size = box.getSize(new THREE.Vector3());
                    const maior = Math.max(size.x, size.y, size.z);
                    if (maior > 0) {
                        if (size.y > size.x * 1.6 && size.y > size.z * 1.6) cor = 0x14b866;
                        else if (size.x > size.y * 2 || size.z > size.y * 2) cor = 0x1e8bb8;
                        else cor = 0x237c98;
                    }
                } catch (e) {}
            }

            if (child.material) {
                setMaterialColor(child.material, cor);
            }
        }

        function getGrupoEstruturaLetra(obj) {
            const nome = getChaveBlenderDaHierarquia(obj) || normalizarNome(obj.name || '');
            const m = nome.match(/^([A-Z])\d{2}/);
            return m ? m[1] : null;
        }

        function atualizarVisibilidadePlacas() {
            placasGeral.forEach(placa => {
                if (placa.userData && placa.userData.elemento) {
                    placa.userData.elemento.style.display = estruturasVisiveis ? 'block' : 'none';
                }
            });
        }

                // --- 5. APLICAR FILTROS (CORREÇÃO DO VISUAL) ---
        let meshesCriticos = [];

        function aplicarFiltrosECores() {
            if(!modeloGeral) return;
            meshesCriticos = [];
            
            modeloGeral.traverse(child => {
                if (!child.isMesh) return;
                
                const endFull = getEnderecoDaHierarquia(child);
                
                // Se não tiver endereço, é uma estrutura (pilar, viga). Mantemos 100% visível sempre.
                if (!endFull) {
                    child.material.transparent = false;
                    child.material.opacity = 1.0;
                    return;
                }

                let estaSelecionado = false;
                if (arrSelecionados.length === 0) {
                    estaSelecionado = true;
                } else {
                    const regex = /([A-Z]\d{2}-N\d{2})/;
                    const matchEnd = endFull.match(regex);
                    estaSelecionado = arrSelecionados.some(sel => {
                        if (sel === endFull || endFull.includes(sel) || sel.includes(endFull)) return true;
                        const matchSel = sel.match(regex);
                        if (matchEnd && matchSel && matchEnd[1] === matchSel[1]) return true;
                        return false;
                    });
                }

                // Se for uma caixa NÃO selecionada, fica 5% visível (quase oculta)
                if (!estaSelecionado) {
                    child.material.transparent = true;
                    child.material.opacity = 0.05; 
                    child.material.depthWrite = false;
                    child.material.color.setHex(0x555555); 
                    if (child.material.emissive) child.material.emissive.setHex(0x000000);
                } else {
                    // Caixa selecionada ou filtro vazio
                    child.material.transparent = false;
                    child.material.opacity = 1.0;
                    child.material.depthWrite = true;

                    const info = buscarDadosSeguro(endFull);

                    if (modoStatusAtivo && info) {
                        const corHex = corPorStatus(info.status);
                        child.material.color.setHex(corHex);
                        const statusUpper = (info.status || '').toUpperCase();
                        
                        if (statusUpper === 'CRITICO' || statusUpper === 'CRÍTICO') {
                            if (!child.material.emissive) child.material.emissive = new THREE.Color(0x000000);
                            child.material.emissive.setHex(corHex);
                            child.material.emissiveIntensity = 0.8; // Efeito neon ajustável aqui!
                            meshesCriticos.push(child);
                        } else {
                            if (child.material.emissive) child.material.emissive.setHex(0x000000);
                        }
                    } else {
                        if (child.userData.corOriginal !== undefined) {
                            child.material.color.setHex(child.userData.corOriginal);
                        }
                        if (child.material.emissive) child.material.emissive.setHex(0x000000);
                    }
                }
            });
        }

        // --- 6. GERAR APENAS 3 PLACAS (CORREDOR A, B, C) ---
        function criar3PlacasCorredor() {
            placasGeral.forEach(p => scene.remove(p));
            placasGeral = [];

            const dadosPorLetra = {
                'A': { soma: new THREE.Vector3(), count: 0, maxY: -Infinity },
                'B': { soma: new THREE.Vector3(), count: 0, maxY: -Infinity },
                'C': { soma: new THREE.Vector3(), count: 0, maxY: -Infinity }
            };

            if (!modeloGeral) return;

            modeloGeral.traverse(child => {
                if (child.isMesh) {
                    const end = getEnderecoDaHierarquia(child);
                    if (end) {
                        const match = end.match(/([A-Z])\d{2}-N\d{2}/);
                        if (match) {
                            const letra = match[1].toUpperCase(); 
                            if (dadosPorLetra[letra]) {
                                const pos = new THREE.Vector3();
                                child.getWorldPosition(pos);
                                dadosPorLetra[letra].soma.add(pos);
                                dadosPorLetra[letra].count++;

                                const box = new THREE.Box3().setFromObject(child);
                                if (box.max.y > dadosPorLetra[letra].maxY) {
                                    dadosPorLetra[letra].maxY = box.max.y;
                                }
                            }
                        }
                    }
                }
            });

            ['A', 'B', 'C'].forEach(letra => {
                const d = dadosPorLetra[letra];
                if (d.count > 0) {
                    const centro = d.soma.divideScalar(d.count);
                    const div = document.createElement('div');
                    div.className = 'placa-corredor';
                    div.innerText = `Estrutura ${letra}`;
                    div.style.display = estruturasVisiveis ? 'block' : 'none';

                    const placaCSS = new THREE.CSS2DObject(div);
                    placaCSS.position.set(centro.x, d.maxY + 3.0, centro.z);
                    placaCSS.userData.elemento = div;
                    placaCSS.userData.letra = letra;
                    scene.add(placaCSS);
                    placasGeral.push(placaCSS);
                }
            });
        }

        // --- 7. MOUSE, TOOLTIP E CLIQUE ---
        function atualizarPosicaoMouse(e) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        }

        // --- 7.1 TOOLTIP SOBRE O CANVAS WEBGL ---
        renderer.domElement.addEventListener('pointermove', (e) => {
            if (!modeloGeral) return;

            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(modeloGeral.children, true);

            let hit = null;
            let data = null;

            for (let i = 0; i < intersects.length; i++) {
                const obj = intersects[i].object;
                if (!obj || !obj.visible) continue;

                data = buscarDadosSeguro(getChaveBlenderDaHierarquia(obj)) || buscarDadosSeguro(getEnderecoDaHierarquia(obj));
                if (data) {
                    hit = obj;
                    break;
                }
            }

            if (!hit || !data) {
                tooltip.style.display = 'none';
                return;
            }

            const endereco = data.endereco || getEnderecoDaHierarquia(hit) || data.nomeBlender || 'N/A';
            const cap = Number(data.capacidade) || 0;
            const est = Number(data.estoque) || 0;
            const pct = cap > 0 ? Math.round((est / cap) * 100) : 0;
            const corBarra = pct > 90 ? '#ff0055' : (pct > 50 ? '#ffb700' : '#00ff55');

            tooltip.style.display = 'block';
            tooltip.style.left = Math.min(e.clientX + 18, window.innerWidth - 280) + 'px';
            tooltip.style.top = Math.min(e.clientY + 18, window.innerHeight - 260) + 'px';

            tooltip.innerHTML = `
                <div class="tt-header">${endereco}</div>
                <div class="tt-line"><span class="tt-label">Código</span><span class="tt-value">${data.codigoProduto || 'N/A'}</span></div>
                <div class="tt-line"><span class="tt-label">Produto</span><span class="tt-value">${data.produto || 'N/A'}</span></div>
                <div class="tt-line"><span class="tt-label">Unidade</span><span class="tt-value">${data.unidadeMedida || 'N/A'}</span></div>
                <div class="tt-line"><span class="tt-label">Estoque</span><span class="tt-value">${data.estoque ?? 0}</span></div>
                <div class="tt-line"><span class="tt-label">Custo Unit.</span><span class="tt-value">${data.custoUnitario ?? 0}</span></div>
                <div class="tt-line"><span class="tt-label">Custo Total</span><span class="tt-value">${data.custoTotal ?? 0}</span></div>
                <div class="tt-line"><span class="tt-label">Segmento</span><span class="tt-value">${data.segmento || 'N/A'}</span></div>
                <div class="tt-line"><span class="tt-label">Validade</span><span class="tt-value">${data.validade || 'N/A'}</span></div>
                <div class="tt-line"><span class="tt-label">Família</span><span class="tt-value">${data.familia || 'N/A'}</span></div>
                <div class="tt-line"><span class="tt-label">Giro</span><span class="tt-value">${data.giro || 'N/A'}</span></div>
                <div class="tt-line" style="margin-top:10px;"><span class="tt-label">Ocupação</span><span class="tt-value">${pct}%</span></div>
                <div class="barra-fundo" style="margin-top:2px;"><div class="barra-preenchida" style="width:${Math.min(pct,100)}%; background:${corBarra};"></div></div>
            `;
        });

        renderer.domElement.addEventListener('pointerleave', () => {
            tooltip.style.display = 'none';
        });

        window.addEventListener('click', (e) => {
            if (e.target.closest('#ui-controles') || e.target.closest('#painel-kpi') || e.target.closest('#hud-topo')) return;
            if (!modeloGeral) return;

            atualizarPosicaoMouse(e);
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(modeloGeral.children, true);

            if (intersects.length > 0) {
                let endFull = null;
                for (let i = 0; i < intersects.length; i++) {
                    endFull = getEnderecoDaHierarquia(intersects[i].object);
                    if (endFull) break;
                }

                if (endFull) {
                    const info = buscarDadosSeguro(endFull) || {};
                    let tituloVisual = endFull;
                    const matchVisual = endFull.match(/([A-Z]\d{2}-N\d{2})/);
                    if(matchVisual) tituloVisual = matchVisual[1];

                    exibirKPI(tituloVisual, info);
                }
            }
        });

        function exibirKPI(enderecoVisual, d) {
            document.getElementById('kpi-endereco').innerText = enderecoVisual;
            document.getElementById('kpi-produto').innerText = d.produto || 'N/A';
            document.getElementById('kpi-estoque').innerText = d.estoque ?? 0;
            document.getElementById('kpi-capacidade').innerText = d.capacidade ?? 0;
            document.getElementById('kpi-status').innerText = d.status || 'N/A';

            const cap = Number(d.capacidade) || 0;
            const est = Number(d.estoque) || 0;
            const pct = cap > 0 ? Math.round((est / cap) * 100) : 0;
            
            // Cores de status baseadas no Cyberpunk para o KPI
            let corBarra = '#00ff55';
            if(pct > 50) corBarra = '#ffb700';
            if(pct > 90) corBarra = '#ff0055';

            document.getElementById('kpi-pct').innerText = pct + '%';
            document.getElementById('kpi-barra').style.width = Math.min(pct, 100) + '%';
            document.getElementById('kpi-barra').style.background = corBarra;
            
            painelKPI.style.display = 'block';
        }

        document.getElementById('kpi-fechar').addEventListener('click', () => {
            painelKPI.style.display = 'none';
        });

        // Loop de Renderização
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();

        // Tratamento de redimensionamento da janela
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Controles de Botões Visuais Básicos (Frente, Topo, Lado)
        document.getElementById('btn-frente').addEventListener('click', () => {
            if(modeloGeral) tweenCamera(new THREE.Vector3(centroGeral.x, centroGeral.y, centroGeral.z + tamanhoMax * 1.5), centroGeral, 1000);
        });
        document.getElementById('btn-topo').addEventListener('click', () => {
            if(modeloGeral) tweenCamera(new THREE.Vector3(centroGeral.x, centroGeral.y + tamanhoMax * 1.5, centroGeral.z), centroGeral, 1000);
        });
        document.getElementById('btn-lado').addEventListener('click', () => {
            if(modeloGeral) tweenCamera(new THREE.Vector3(centroGeral.x + tamanhoMax * 1.5, centroGeral.y, centroGeral.z), centroGeral, 1000);
        });
        document.getElementById('btn-estrutura').addEventListener('click', (e) => {
            estruturasVisiveis = !estruturasVisiveis;
            e.target.innerText = estruturasVisiveis ? 'Estruturas: Visíveis' : 'Estruturas: Ocultas';
            e.target.classList.toggle('btn-toggle-ativo', estruturasVisiveis);
            atualizarVisibilidadePlacas();
        });

        document.getElementById('btn-status').addEventListener('click', (e) => {
            modoStatusAtivo = !modoStatusAtivo;
            if(modoStatusAtivo) {
                e.target.innerText = "Modo: Status (Ligado)";
                e.target.classList.add('btn-toggle-ativo');
                document.getElementById('legenda-status').style.display = 'block';
                document.getElementById('hud-legenda').style.display = 'block';
            } else {
                e.target.innerText = "Modo: Status (Desligado)";
                e.target.classList.remove('btn-toggle-ativo');
                document.getElementById('legenda-status').style.display = 'none';
                document.getElementById('hud-legenda').style.display = 'none';
            }
            aplicarFiltrosECores();
        });

    </script>
</body>
</html>
